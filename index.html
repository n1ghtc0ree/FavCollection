<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <script src="script.js" defer></script>
    <link rel="icon" href="https://img.icons8.com/neon/96/movie.png" type="image/png" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <title>CineFlow</title>
  </head>
  <body>
    <div class="app-wrapper">
      <header>
        <div class="header-container">
          <div class="logo-zone">
            <span class="logo-text">CINEFLOW</span>
          </div>
          
          <form class="search-zone" id="quickAddForm" action="">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input 
              type="text" 
              id="quickAddInput" 
              placeholder="Search movie..." 
              enterkeyhint="done"
              autocomplete="off"
              autocorrect="off"
              autocapitalize="off"
              spellcheck="false"
            />
            <button type="submit" class="search-submit-btn" title="Done">
              <i class="fa-solid fa-check"></i>
            </button>
          </form>
        </div>
      </header>

      <main>
        <div class="filter-bar">
          <button class="filter-btn active" id="filterAll">All</button>
          <button class="filter-btn" id="filterFantasyAdventure">Fantasy-adventure</button>
          <button class="filter-btn" id="filterAnimated">Animated</button>
          <button class="filter-btn" id="filterFantasyRomance">Fantasy-romance</button>
          <button class="filter-btn" id="filterAdventure">Adventure</button>
          <button class="filter-btn" id="filterSciFi">Sci-Fi</button>
          <button class="filter-btn" id="filterHorror">Horror</button>
          <button class="filter-btn" id="filterThriller">Thriller</button>
          <button class="filter-btn" id="filterDrama">Drama</button>
          <button class="filter-btn" id="filterAction">Action</button>
          <button class="filter-btn" id="filterComedy">Comedy</button>
        </div>
      </main>

      <main>
        <div class="books-list" id="booksList"></div>
      </main>
    </div>

    <div class="modal-overlay" id="bookModal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Edit favourite</h2>
          <button class="modal-close" id="closeModal">✕</button>
        </div>
        <form id="bookForm">
          <div class="form-group">
            <label>Title</label>
            <input type="text" id="bookName" required autocomplete="off" spellcheck="false" />
          </div>
          <div class="form-group">
            <label>Cover Image URL</label>
            <input type="text" id="bookImg" placeholder="Paste Image URL" autocomplete="off" />
            <div class="file-upload-wrapper" id="fileUploadWrapper">
              <input type="file" id="bookFile" class="file-upload-input" accept="image/*" />
              <div class="file-upload-btn" id="fileUploadText">
                <i class="fa-solid fa-cloud-arrow-up"></i> Choose New Image File
              </div>
            </div>
          </div>
          <div class="form-group">
            <label>Category</label>
            <select id="bookCategory" required>
              <option value="Fantasy-adventure">Fantasy-adventure</option>
              <option value="Animated">Animated</option>
              <option value="Fantasy-romance">Fantasy-romance</option>
              <option value="Adventure">Adventure</option>
              <option value="Sci-Fi">Sci-Fi</option>
              <option value="Horror">Horror</option>
              <option value="Thriller">Thriller</option>
              <option value="Drama">Drama</option>
              <option value="Action">Action</option>
              <option value="Comedy">Comedy</option>
            </select>
          </div>
          <div class="form-group">
            <label>Description</label>
            <textarea id="bookDesc" spellcheck="false"></textarea>
          </div>
          <button type="submit" class="submit-btn">Save Changes</button>
        </form>
      </div>
    </div>
  </body>
</html>
