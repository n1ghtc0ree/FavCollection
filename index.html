<!doctype html>
<html lang="en">
  <head>
    <meta name="google-site-verification" content="TvlyHPwgllnqD82XAdXHwFKUgh6RCQyKf2fs0z0y_zY" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="CineFlow is your personal movie and show tracker. Quickly add titles, organize what you've watched, and keep your media list all in one place." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://cineflowey.netlify.app/" />

    <!-- Open Graph -->
    <meta property="og:title" content="CineFlow" />
    <meta property="og:description" content="Your personal movie and show tracker. Quickly add titles and keep your media list all in one place." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://cineflowey.netlify.app/" />
    <meta property="og:image" content="https://cineflowey.netlify.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CineFlow" />
    <meta name="twitter:description" content="Your personal movie and show tracker. Quickly add titles and keep your media list all in one place." />
    <meta name="twitter:image" content="https://cineflowey.netlify.app/og-image.png" />

    <script src="script.js" defer></script>
    <link rel="icon" href="img/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <title>CineFlow</title>
  </head>
  <body>
    <div class="app-wrapper">
      <div id="debug-log"></div>
      
      <header class="animate-entry d-1">
        <div class="header-container">
          <div class="logo-zone">
            <span class="logo-text">CINEFLOW</span>
            <div class="clear-storage-wrapper">
              <button class="clear-storage-btn" id="clearStorageBtn" title="Clear all data">
                <i class="fa-solid fa-trash"></i>
              </button>
              <div class="clear-popup" id="clearPopup">
                <div class="clear-popup-text">Clear all media data?</div>
                <div class="clear-popup-actions">
                  <button type="button" class="clear-confirm-btn" id="clearConfirmBtn">Yes, clear</button>
                  <button type="button" class="clear-cancel-btn" id="clearCancelBtn">Cancel</button>
                </div>
              </div>
            </div>
          </div>
          <form class="search-zone" id="quickAddForm" action="">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" id="quickAddInput" placeholder="Quick add by title..." autocomplete="off" />
            <button type="submit" class="search-submit-btn"><i class="fa-solid fa-plus"></i></button>
          </form>
        </div>
      </header>

      <main>
        <div class="filter-bar animate-entry d-2" id="filterBar"></div>
        <div class="mobile-hint" id="mobileHint">
          <i class="fa-solid fa-circle-info"></i> Tap to view info • Hold card to edit/delete
        </div>
        <div class="books-list" id="booksList"></div>
      </main>
    </div>

    <div class="modal-overlay" id="bookModal">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="modalTitle">Edit Movie</h2>
          <button class="modal-close" id="closeModal">✕</button>
        </div>
        <form class="modal-body" id="bookForm">
          <div class="form-group">
            <label>Title *</label>
            <input type="text" id="bookTitle" required />
          </div>
          <div class="form-group">
            <label>Image URL</label>
            <input type="text" id="bookImg" placeholder="Leave empty to auto-fetch" />
          </div>
          <div class="form-group">
            <label>Category</label>
            <select id="bookCategory">
              <option value="Sci-Fi">Sci-Fi</option>
              <option value="Fantasy">Fantasy</option>
              <option value="Animation">Animation</option>
              <option value="Romance">Romance</option>
              <option value="Adventure">Adventure</option>
              <option value="Horror">Horror</option>
              <option value="Thriller">Thriller</option>
              <option value="Drama">Drama</option>
              <option value="Action">Action</option>
              <option value="Comedy">Comedy</option>
            </select>
          </div>
          <div class="form-group">
            <label>Description</label>
            <textarea id="bookDesc" spellcheck="false"></textarea>
          </div>
          <div class="modal-actions-row">
            <button type="button" class="modal-delete-btn" id="modalDeleteBtn" title="Delete">
              <i class="fa-regular fa-trash-can"></i>
            </button>
            <button type="submit" class="submit-btn">Save Changes</button>
          </div>
        </form>
      </div>
    </div>

    <div class="modal-overlay" id="viewModal">
      <div class="modal-content view-modal">
        <div class="modal-header">
          <h2>Movie Details</h2>
          <button class="modal-close" id="closeViewModal">✕</button>
        </div>
        <div class="view-modal-body">
          <div class="view-modal-image" id="viewModalImage"></div>
          <div class="view-modal-info">
            <div class="view-modal-category" id="viewModalCategory"></div>
            <h3 class="view-modal-title" id="viewModalTitle"></h3>
            <div class="view-modal-desc" id="viewModalDesc"></div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
